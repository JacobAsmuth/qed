[package]
name = "qed_server"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
getrandom = "0.2"
hmac = "0.12"
libc = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
webpki-roots = "0.26"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
