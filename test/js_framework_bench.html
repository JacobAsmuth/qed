<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>js-framework-benchmark</title>
</head>
<body>
  <div id="root"></div>
  <script>
    const fw = new URLSearchParams(window.location.search).get('fw') || 'vanilla';

    // Exact js-framework-benchmark wordlists + deterministic MINSTD LCG matching Bench/App.lean.
    const A = [
      'pretty', 'large', 'big', 'small', 'tall', 'short', 'long', 'handsome',
      'plain', 'quaint', 'clean', 'elegant', 'easy', 'angry', 'crazy', 'helpful',
      'mushy', 'odd', 'unsightly', 'adorable', 'important', 'inexpensive', 'cheap',
      'expensive', 'fancy',
    ];
    const C = [
      'red', 'yellow', 'blue', 'green', 'pink', 'brown', 'purple', 'brown',
      'white', 'black', 'orange',
    ];
    const N = [
      'table', 'chair', 'house', 'bbq', 'desk', 'car', 'pony', 'cookie',
      'sandwich', 'burger', 'pizza', 'mouse', 'keyboard',
    ];

    let nextId = 1;
    let seed = 1;
    const nextSeed = (s) => (s * 48271) % 2147483647;
    function buildData(count) {
      const out = new Array(count);
      for (let i = 0; i < count; i++) {
        const s1 = nextSeed(seed);
        const s2 = nextSeed(s1);
        const s3 = nextSeed(s2);
        seed = s3;
        out[i] = {
          id: nextId++,
          label: `${A[s1 % A.length]} ${C[s2 % C.length]} ${N[s3 % N.length]}`,
        };
      }
      return out;
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error(`failed to load ${src}`));
        document.head.appendChild(s);
      });
    }

    const SHELL_HTML = (title) => `
      <div id="main"><div class="container">
        <div class="jumbotron"><div class="row">
          <div class="col-md-6"><h1>${title}</h1></div>
          <div class="col-md-6"><div class="row">
            <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="run">Create 1,000 rows</button></div>
            <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="runlots">Create 10,000 rows</button></div>
            <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="add">Append 1,000 rows</button></div>
            <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="update">Update every 10th row</button></div>
            <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="clear">Clear</button></div>
            <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="swaprows">Swap Rows</button></div>
          </div></div>
        </div></div>
        <table class="table table-hover table-striped test-data"><tbody id="tbody"></tbody></table>
        <span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
      </div></div>`;

    function mountVanilla() {
      const root = document.getElementById('root');
      root.innerHTML = SHELL_HTML('VanillaJS (keyed)');
      const tbody = document.getElementById('tbody');

      const rowTmpl = document.createElement('tr');
      rowTmpl.innerHTML =
        '<td class="col-md-1"> </td>' +
        '<td class="col-md-4"><a class="lbl"> </a></td>' +
        '<td class="col-md-1"><a class="remove"><span class="glyphicon glyphicon-remove" aria-hidden="true"></span></a></td>' +
        '<td class="col-md-6"></td>';

      let data = [];
      let rows = [];
      let selectedTr = null;

      function createRow(item) {
        const tr = rowTmpl.cloneNode(true);
        const td1 = tr.firstChild;
        const a1 = td1.nextSibling.firstChild;
        td1.firstChild.nodeValue = String(item.id);
        a1.firstChild.nodeValue = item.label;
        tr._id = item.id;
        return tr;
      }

      function appendRows(items) {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < items.length; i++) {
          const tr = createRow(items[i]);
          rows.push(tr);
          frag.appendChild(tr);
        }
        tbody.appendChild(frag);
      }

      function clear() {
        tbody.textContent = '';
        data = [];
        rows = [];
        selectedTr = null;
      }

      document.getElementById('run').addEventListener('click', () => {
        clear();
        data = buildData(1000);
        appendRows(data);
      });
      document.getElementById('runlots').addEventListener('click', () => {
        clear();
        data = buildData(10000);
        appendRows(data);
      });
      document.getElementById('add').addEventListener('click', () => {
        const more = buildData(1000);
        data = data.concat(more);
        appendRows(more);
      });
      document.getElementById('update').addEventListener('click', () => {
        for (let i = 0; i < data.length; i += 10) {
          data[i].label += ' !!!';
          rows[i].firstChild.nextSibling.firstChild.firstChild.nodeValue = data[i].label;
        }
      });
      document.getElementById('clear').addEventListener('click', clear);
      document.getElementById('swaprows').addEventListener('click', () => {
        if (rows.length > 998) {
          const tr1 = rows[1];
          const tr998 = rows[998];
          const after998 = tr998.nextSibling;
          tbody.insertBefore(tr998, tr1);
          tbody.insertBefore(tr1, after998);
          rows[1] = tr998;
          rows[998] = tr1;
          const tmp = data[1];
          data[1] = data[998];
          data[998] = tmp;
        }
      });
      tbody.addEventListener('click', (e) => {
        const tr = e.target.closest('tr');
        if (!tr) return;
        if (e.target.closest('a.remove')) {
          const idx = rows.indexOf(tr);
          if (idx >= 0) {
            rows.splice(idx, 1);
            data.splice(idx, 1);
            if (selectedTr === tr) selectedTr = null;
            tr.remove();
          }
        } else if (e.target.closest('a.lbl')) {
          if (selectedTr) selectedTr.className = '';
          selectedTr = tr;
          tr.className = 'danger';
        }
      });
      window.__jsfwReady = true;
    }

    async function mountReact(useMemo) {
      await loadScript('vendor/react.production.min.js');
      await loadScript('vendor/react-dom.production.min.js');
      const h = React.createElement;

      let Row = function Row({ item, selected, onSelect, onRemove }) {
        return h('tr', { className: selected ? 'danger' : '' },
          h('td', { className: 'col-md-1' }, item.id),
          h('td', { className: 'col-md-4' },
            h('a', { onClick: () => onSelect(item.id) }, item.label)),
          h('td', { className: 'col-md-1' },
            h('a', { onClick: () => onRemove(item.id) },
              h('span', { className: 'glyphicon glyphicon-remove', 'aria-hidden': 'true' }))),
          h('td', { className: 'col-md-6' }));
      };
      if (useMemo) Row = React.memo(Row);

      function App() {
        const [data, setData] = React.useState([]);
        const [selected, setSelected] = React.useState(0);

        const run = React.useCallback(() => { setData(buildData(1000)); setSelected(0); }, []);
        const runLots = React.useCallback(() => { setData(buildData(10000)); setSelected(0); }, []);
        const add = React.useCallback(() => { setData((d) => d.concat(buildData(1000))); }, []);
        const update = React.useCallback(() => {
          setData((d) => {
            const next = d.slice();
            for (let i = 0; i < next.length; i += 10) {
              next[i] = { id: next[i].id, label: next[i].label + ' !!!' };
            }
            return next;
          });
        }, []);
        const clear = React.useCallback(() => { setData([]); setSelected(0); }, []);
        const swapRows = React.useCallback(() => {
          setData((d) => {
            if (d.length <= 998) return d;
            const next = d.slice();
            const tmp = next[1]; next[1] = next[998]; next[998] = tmp;
            return next;
          });
        }, []);
        const onSelect = React.useCallback((id) => setSelected(id), []);
        const onRemove = React.useCallback((id) => {
          setData((d) => {
            const idx = d.findIndex((r) => r.id === id);
            if (idx < 0) return d;
            const next = d.slice();
            next.splice(idx, 1);
            return next;
          });
        }, []);

        return h('div', { id: 'main' },
          h('div', { className: 'container' },
            h('div', { className: 'jumbotron' },
              h('div', { className: 'row' },
                h('div', { className: 'col-md-6' }, h('h1', null, useMemo ? 'React 18 (memo)' : 'React 18')),
                h('div', { className: 'col-md-6' },
                  h('div', { className: 'row' },
                    h('div', { className: 'col-sm-6 smallpad' }, h('button', { type: 'button', className: 'btn btn-primary btn-block', id: 'run', onClick: run }, 'Create 1,000 rows')),
                    h('div', { className: 'col-sm-6 smallpad' }, h('button', { type: 'button', className: 'btn btn-primary btn-block', id: 'runlots', onClick: runLots }, 'Create 10,000 rows')),
                    h('div', { className: 'col-sm-6 smallpad' }, h('button', { type: 'button', className: 'btn btn-primary btn-block', id: 'add', onClick: add }, 'Append 1,000 rows')),
                    h('div', { className: 'col-sm-6 smallpad' }, h('button', { type: 'button', className: 'btn btn-primary btn-block', id: 'update', onClick: update }, 'Update every 10th row')),
                    h('div', { className: 'col-sm-6 smallpad' }, h('button', { type: 'button', className: 'btn btn-primary btn-block', id: 'clear', onClick: clear }, 'Clear')),
                    h('div', { className: 'col-sm-6 smallpad' }, h('button', { type: 'button', className: 'btn btn-primary btn-block', id: 'swaprows', onClick: swapRows }, 'Swap Rows')))))),
            h('table', { className: 'table table-hover table-striped test-data' },
              h('tbody', { id: 'tbody' },
                data.map((item) => h(Row, {
                  key: item.id,
                  item,
                  selected: selected === item.id,
                  onSelect,
                  onRemove,
                })))),
            h('span', { className: 'preloadicon glyphicon glyphicon-remove', 'aria-hidden': 'true' })));
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      ReactDOM.flushSync(() => root.render(h(App)));
      window.__jsfwReady = true;
    }

    async function mountVue() {
      await loadScript('vendor/vue.global.prod.js');
      const { createApp, shallowRef, triggerRef } = Vue;

      const app = createApp({
        setup() {
          const rows = shallowRef([]);
          const selected = shallowRef(0);

          const run = () => { rows.value = buildData(1000); selected.value = 0; };
          const runLots = () => { rows.value = buildData(10000); selected.value = 0; };
          const add = () => { rows.value = rows.value.concat(buildData(1000)); };
          const update = () => {
            const d = rows.value;
            for (let i = 0; i < d.length; i += 10) {
              d[i] = { id: d[i].id, label: d[i].label + ' !!!' };
            }
            triggerRef(rows);
          };
          const clear = () => { rows.value = []; selected.value = 0; };
          const swapRows = () => {
            const d = rows.value;
            if (d.length > 998) {
              const tmp = d[1]; d[1] = d[998]; d[998] = tmp;
              triggerRef(rows);
            }
          };
          const select = (id) => { selected.value = id; };
          const remove = (id) => {
            const d = rows.value;
            const idx = d.findIndex((r) => r.id === id);
            if (idx >= 0) { d.splice(idx, 1); triggerRef(rows); }
          };

          return { rows, selected, run, runLots, add, update, clear, swapRows, select, remove };
        },
        template: `
          <div id="main"><div class="container">
            <div class="jumbotron"><div class="row">
              <div class="col-md-6"><h1>Vue 3 (keyed)</h1></div>
              <div class="col-md-6"><div class="row">
                <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="run" @click="run">Create 1,000 rows</button></div>
                <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="runlots" @click="runLots">Create 10,000 rows</button></div>
                <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="add" @click="add">Append 1,000 rows</button></div>
                <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="update" @click="update">Update every 10th row</button></div>
                <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="clear" @click="clear">Clear</button></div>
                <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="swaprows" @click="swapRows">Swap Rows</button></div>
              </div></div>
            </div></div>
            <table class="table table-hover table-striped test-data">
              <tbody id="tbody">
                <tr v-for="r in rows" :key="r.id" :class="{ danger: r.id === selected }" v-memo="[r.label, r.id === selected]">
                  <td class="col-md-1">{{ r.id }}</td>
                  <td class="col-md-4"><a @click="select(r.id)">{{ r.label }}</a></td>
                  <td class="col-md-1"><a @click="remove(r.id)"><span class="glyphicon glyphicon-remove" aria-hidden="true"></span></a></td>
                  <td class="col-md-6"></td>
                </tr>
              </tbody>
            </table>
            <span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
          </div></div>`,
      });
      app.mount('#root');
      window.__jsfwReady = true;
    }

    if (fw === 'vanilla') mountVanilla();
    else if (fw === 'react') mountReact(false);
    else if (fw === 'react-memo') mountReact(true);
    else if (fw === 'vue') mountVue();
    else throw new Error(`unknown fw: ${fw}`);
  </script>
</body>
</html>
