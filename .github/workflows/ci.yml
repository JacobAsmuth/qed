name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-and-test:
    name: Verify Proofs & Run Test Suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/qed_server

      - name: Cache elan toolchains
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install elan (Lean toolchain manager)
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            case "$(uname -sm)" in
              "Linux x86_64")   TRIPLE="x86_64-unknown-linux-gnu" ;;
              "Linux aarch64")  TRIPLE="aarch64-unknown-linux-gnu" ;;
              "Darwin arm64")   TRIPLE="aarch64-apple-darwin" ;;
              "Darwin x86_64")  TRIPLE="x86_64-apple-darwin" ;;
              *) echo "unsupported platform $(uname -sm)" >&2; exit 1 ;;
            esac
            curl -sSfL "https://github.com/leanprover/elan/releases/latest/download/elan-${TRIPLE}.tar.gz" \
              | tar -xz -C /tmp
            /tmp/elan-init -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Cache Lake build artifacts
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-

      - name: Build CLI and verify proofs, axioms & gates
        run: ./scripts/qed check

      - name: Run full test suite
        env:
          QED_TEST_TIMING: "1"
        run: ./scripts/qed test
